  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #080808;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .background-ambient {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(222, 179, 74, 0.08) 0%, rgba(8, 8, 8, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      max-width: 540px;
      padding: 3rem 2.5rem;
      margin: 1.5rem;
      background: rgba(18, 18, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(222, 179, 74, 0.35);
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #deb34a;
      margin-bottom: 2rem;
      background: rgba(222, 179, 74, 0.05);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #deb34a;
    }
    .glitch-code {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2.25rem;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      background: #deb34a;
      color: #080808;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background: #e6be65;
      transform: translateY(-1px);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }

<style>
/* GPU-Stepped Film Grain (0% CPU, Compositor-Only Hardware Tiling) */
.samaria-noise-overlay {
  position: fixed;
  top: -100%;
  left: -100%;
  width: 300%;
  height: 300%;
  pointer-events: none;
  opacity: 0.04;
  z-index: 9999;
  background-image: url("/noise.png");
  background-repeat: repeat;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  animation: 2.5s steps(5, end) infinite noise-grain;
}
@keyframes noise-grain {
  0%   { transform: translate3d(0, 0, 0); }
  20%  { transform: translate3d(-3%, -6%, 0); }
  40%  { transform: translate3d(-8%, 3%, 0); }
  60%  { transform: translate3d(4%, -10%, 0); }
  80%  { transform: translate3d(-3%, 7%, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .samaria-noise-overlay {
    animation: none !important;
  }
}

/* 3D Water Ripple Card Overlay */
.card-ripple-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity;
}
.card-ripple-active .card-ripple-canvas {
  opacity: 1;
}
.project-vid, .project-file {
  position: relative;
}
</style>

<style>
/* Native System Cursor Restoration & Overlay Removal */
.cursor-wrap, .custom-cursor, .hand-cursor, .arrow-cursor, .absolute-hover, .absolute-hand {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
html, body, .body, .page-wrapper, .page-wrapper.no-cursor, * {
  cursor: auto !important;
}
a, button, [href], .hoverable, [open-modal], .action-button, .close-popup, .close-project, [data-navigation-toggle], .pri-link, .top-link, .link-absolute {
  cursor: pointer !important;
}
input, textarea, select {
  cursor: text !important;
}
#m-mecha-container, .sidebar-video, #m-popup-container {
  cursor: grab !important;
}
</style>
