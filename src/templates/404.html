<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>404 — Page Not Found | Samaria Tech</title>
  <meta name="description" content="The requested page could not be located on the Samaria Tech platform."/>
  <meta property="og:title" content="404 — Page Not Found | Samaria Tech"/>
  <meta property="og:description" content="The requested page could not be located on the Samaria Tech platform."/>
  <meta property="og:image" content="/icon-512.png"/>
  <meta property="og:type" content="website"/>
  <meta name="twitter:card" content="summary_large_image"/>

  <link href="/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
  <link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
  <link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png"/>
  <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #080808;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .background-ambient {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(222, 179, 74, 0.08) 0%, rgba(8, 8, 8, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      max-width: 540px;
      padding: 3rem 2.5rem;
      margin: 1.5rem;
      background: rgba(18, 18, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(222, 179, 74, 0.35);
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #deb34a;
      margin-bottom: 2rem;
      background: rgba(222, 179, 74, 0.05);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #deb34a;
    }
    .glitch-code {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2.25rem;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      background: #deb34a;
      color: #080808;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background: #e6be65;
      transform: translateY(-1px);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="background-ambient" aria-hidden="true"></div>
  <main class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>404 &bull; Status</span>
    </div>
    <div class="glitch-code">404</div>
    <h1>Page Not Found</h1>
    <p>The requested route or resource could not be located on the Samaria Tech platform.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Return Home</a>
      <a href="/blog" class="btn-secondary">Read Insights</a>
    </div>
  </main>
</body>
</html>
