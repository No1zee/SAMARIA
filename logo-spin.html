<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Samaria</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --accent-color: rgba(196, 147, 58, 0.15); /* Gold/Bronze accent matching logo */
            --spin-speed: 5s;
            --ring-speed: 20s;
        }

        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            font-family: sans-serif;
            perspective: 1200px;
        }

        /* Immersive Background Elements */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed var(--accent-color);
            animation: bg-rotate var(--ring-speed) linear infinite;
        }

        .ring-1 { width: 400px; height: 400px; opacity: 0.6; animation-duration: 25s; }
        .ring-2 { width: 600px; height: 600px; opacity: 0.4; animation-duration: 40s; animation-direction: reverse; }
        .ring-3 { width: 850px; height: 850px; opacity: 0.2; animation-duration: 60s; }

        @keyframes bg-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Logo Container */
        .logo-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .logo-image {
            width: 280px;
            height: auto;
            max-width: 80vw;
            /* 3D Spin Animation for Raster Images */
            animation: logo-spin-3d var(--spin-speed) cubic-bezier(0.45, 0, 0.55, 1) infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
        }

        /* Ground Shadow */
        .shadow {
            position: absolute;
            bottom: -60px;
            width: 180px;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: shadow-scale var(--spin-speed) cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        @keyframes logo-spin-3d {
            0% {
                transform: rotateY(0deg);
                filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05)) brightness(1);
            }
            25% {
                filter: drop-shadow(0 10px 10px rgba(0,0,0,0.02)) brightness(1.1);
            }
            50% {
                transform: rotateY(180deg);
                filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05)) brightness(1);
            }
            75% {
                filter: drop-shadow(0 10px 10px rgba(0,0,0,0.02)) brightness(1.1);
            }
            100% {
                transform: rotateY(360deg);
                filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05)) brightness(1);
            }
        }

        @keyframes shadow-scale {
            0%, 50%, 100% {
                transform: scaleX(1);
                opacity: 1;
            }
            25%, 75% {
                transform: scaleX(0.2);
                opacity: 0.3;
            }
        }

        /* Subtle Light Sweep across the whole screen */
        .shimmer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                120deg, 
                rgba(255,255,255,0) 30%, 
                rgba(255,255,255,0.4) 50%, 
                rgba(255,255,255,0) 70%
            );
            pointer-events: none;
            animation: sweep 6s infinite ease-in-out;
            z-index: 5;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(50%); }
        }
    </style>
</head>
