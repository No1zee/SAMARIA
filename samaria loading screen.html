<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samaria Loading...</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #f9e076;
            --bg: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            position: relative;
        }

        /* The Logo Animation */
        .logo-wrapper {
            position: relative;
            width: 400px;
            animation: fadeInScale 1.8s ease-out forwards;
        }

        .main-logo {
            width: 100%;
            height: auto;
            /* This filter helps make the gold pop on dark backgrounds */
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.2));
        }

        /* The Shimmer Effect (Light moving across the gold) */
        .shimmer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                105deg, 
                transparent 40%, 
                rgba(255, 255, 255, 0.4) 50%, 
                transparent 60%
            );
            background-size: 200% 100%;
            mix-blend-mode: overlay;
            animation: shimmer 3s infinite linear;
            pointer-events: none;
        }

        /* The Laptop Pulse */
        .chip-glow {
            position: absolute;
            bottom: 43%; /* Positioned over the laptop area */
            right: 22%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--gold-bright) 0%, transparent 70%);
            opacity: 0;
            animation: pulse 2s infinite ease-in-out 1s;
        }

        /* Loading Text */
        .brand-text {
            margin-top: 20px;
            letter-spacing: 8px;
            color: var(--gold);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        /* Loading Bar */
        .progress-container {
            width: 200px;
            height: 2px;
            background: rgba(212, 175, 55, 0.1);
            margin: 20px auto 0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            animation: loadProgress 4s ease-in-out forwards;
        }

        /* Keyframes */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            30% { width: 40%; }
            60% { width: 45%; }
            100% { width: 100%; }
        }

    </style>
</head>
<body>

    <div class="loader-container">
        <div class="logo-wrapper">
            <!-- Replace 'YOUR_IMAGE_URL' with the path to your logo -->
            <img src="YOUR_IMAGE_URL" alt="Samaria Logo" class="main-logo">
            <div class="shimmer-overlay"></div>
            <div class="chip-glow"></div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        // Optional: Redirect or hide loader when finished
        window.addEventListener('load', () => {
            setTimeout(() => {
                // Here you would normally transition to the main site
                console.log("Website Loaded");
            }, 4000);
        });
    </script>
</body>
</html>
